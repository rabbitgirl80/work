<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="All posts — The Daily Draft blog.">
  <title>The Daily Draft — Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="blog">
  <div id="site-header"></div>
  <main>
    <div class="container">
      <header class="page-hero">
        <h1 class="page-hero__title">Blog</h1>
        <p class="page-hero__desc">Browse by category or scroll every post on The Daily Draft.</p>
      </header>

      <div class="chip-bar" id="category-chips" role="toolbar" aria-label="Filter posts by category"></div>
      <ul class="card-grid" id="blog-grid" aria-label="All blog posts"></ul>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="main.js" type="module"></script>
</body>
</html>
