<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A minimal blog template — essays on design and everyday life.">
  <title>Quiet Notes — Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div id="site-header"></div>
  <main>
    <div class="container">
      <section class="hero section">
        <h1 class="hero__title" id="hero-title">Quiet Notes</h1>
        <p class="hero__tagline" id="hero-tagline">Loading…</p>
      </section>

      <section class="section" aria-labelledby="featured-label">
        <h2 class="section__label" id="featured-label">Featured</h2>
        <div id="featured-post"></div>
      </section>

      <section class="section" aria-labelledby="latest-label">
        <h2 class="section__label" id="latest-label">Latest</h2>
        <ul class="post-list" id="latest-posts"></ul>
        <p><a class="text-link" href="blog.html">Read all posts →</a></p>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="main.js" type="module"></script>
</body>
</html>
