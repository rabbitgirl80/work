<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The Daily Draft — a personal blog sample.">
  <title>The Daily Draft — Home</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div id="site-header"></div>
  <main>
    <div class="container">
      <section class="home-intro">
        <h1 class="home-intro__title" id="intro-title">The Daily Draft</h1>
        <p class="home-intro__text" id="intro-text">Loading…</p>
      </section>

      <div id="hero-feature"></div>

      <section aria-labelledby="latest-posts">
        <div class="section-head">
          <h2 class="section-head__title" id="latest-posts">Latest posts</h2>
          <a class="section-head__link" href="blog.html">View all posts →</a>
        </div>
        <ul class="card-grid" id="home-grid"></ul>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="main.js" type="module"></script>
</body>
</html>
